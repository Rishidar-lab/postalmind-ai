name: Deploy static gateway to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Assemble static Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -R regard _site/regard
          touch _site/.nojekyll
          cat > _site/index.html <<'HTML'
          <!doctype html>
          <html lang="en">
          <head>
            <meta charset="utf-8">
            <meta name="viewport" content="width=device-width,initial-scale=1">
            <meta http-equiv="refresh" content="0;url=https://postalmind-ai.vercel.app">
            <title>PostalMind</title>
          </head>
          <body>
            <p>PostalMind has moved to <a href="https://postalmind-ai.vercel.app">postalmind-ai.vercel.app</a>.</p>
          </body>
          </html>
          HTML

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
