<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { margin: 0; width: 1200px; height: 630px; display: flex; align-items: center; justify-content: center; background: #030308; font-family: 'Space Grotesk', sans-serif; }
    .card { width: 1200px; height: 630px; display: flex; flex-direction: column; align-items: center; justify-content: center; background: radial-gradient(ellipse at 30% 20%, rgba(76,29,149,0.3), transparent 60%), radial-gradient(ellipse at 70% 80%, rgba(30,58,138,0.2), transparent 60%), #030308; color: #e2e8f0; text-align: center; position: relative; overflow: hidden; }
    .orb1 { position: absolute; top: -100px; left: -100px; width: 400px; height: 400px; border-radius: 50%; background: rgba(124,58,237,0.15); filter: blur(80px); }
    .orb2 { position: absolute; bottom: -100px; right: -100px; width: 350px; height: 350px; border-radius: 50%; background: rgba(6,182,212,0.12); filter: blur(80px); }
    .logo { font-size: 56px; font-weight: 800; margin-bottom: 16px; letter-spacing: -2px; }
    .logo span { color: #a78bfa; }
    .subtitle { font-size: 26px; color: rgba(255,255,255,0.55); font-weight: 400; margin-bottom: 32px; max-width: 800px; line-height: 1.4; }
    .badge { font-size: 14px; font-weight: 700; color: #a78bfa; letter-spacing: 2px; border: 1px solid rgba(124,58,237,0.4); padding: 6px 16px; border-radius: 20px; background: rgba(124,58,237,0.12); }
    .stats { display: flex; gap: 24px; margin-top: 36px; }
    .stat { text-align: center; }
    .stat b { display: block; font-size: 28px; font-weight: 800; color: #a78bfa; }
    .stat span { font-size: 12px; color: rgba(255,255,255,0.4); }
  </style>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <div class="card">
    <div class="orb1"></div>
    <div class="orb2"></div>
    <div class="badge">NOVITA AI × KILO CODE HACKATHON 2026</div>
    <div class="logo" style="margin-top: 24px;">PostalMind <span>AI</span></div>
    <div class="subtitle">AI companion for 1.5 lakh+ India Post GDS Officers<br>Instant answers on CE Rules, RTI, BO workflows &amp; financial services</div>
    <div class="stats">
      <div class="stat"><b>1.5L+</b><span>GDS Officers</span></div>
      <div class="stat"><b>200+</b><span>AI Models</span></div>
      <div class="stat"><b>24/7</b><span>Available</span></div>
    </div>
  </div>
</body>
</html>
